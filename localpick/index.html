<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalPick Korea</title>
<meta name="description" content="Where Koreans actually eat, drink and go in Seoul, Busan, Jeonju and Gyeongju.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Layout: phone-first single column, sticky top bar, cards keyed to a "locals vs tourists" meter */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #15211d;
  --muted: #5b6b65;
  --line: #dbe2de;
  --local: #0d7f61;
  --local-soft: #d9efe7;
  --tourist: #b97a12;
  --tourist-soft: #f6ead2;
  --c-seoul: #3557c9;
  --c-busan: #0a7f99;
  --c-jeonju: #a8532a;
  --c-gyeongju: #7247a6;
  --sign-ink: #ffffff;
  --map-empty: #e4e9e5;
  --shadow: 0 1px 2px rgba(21, 33, 29, .06), 0 4px 16px rgba(21, 33, 29, .06);
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans JP", "IBM Plex Sans KR", "Hiragino Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
  --kr: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #17201d; --ink: #e5ece9; --muted: #9aaba5; --line: #2a3632;
    --local: #3cc59c; --local-soft: #173a30; --tourist: #e3ac4c; --tourist-soft: #3a2f19;
    --c-seoul: #7c97f2; --c-busan: #4fc1d8; --c-jeonju: #e08a62; --c-gyeongju: #b28ce4;
    --sign-ink: #0e1513; --map-empty: #1d2724;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #17201d; --ink: #e5ece9; --muted: #9aaba5; --line: #2a3632;
  --local: #3cc59c; --local-soft: #173a30; --tourist: #e3ac4c; --tourist-soft: #3a2f19;
  --c-seoul: #7c97f2; --c-busan: #4fc1d8; --c-jeonju: #e08a62; --c-gyeongju: #b28ce4;
  --sign-ink: #0e1513; --map-empty: #1d2724;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--local); outline-offset: 2px; border-radius: 6px; }
.kr { font-family: var(--kr); }

/* ── top bar ── */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 1000;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 560px; margin: 0 auto;
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand {
  display: flex; align-items: baseline; gap: 8px;
  text-decoration: none;
  font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em;
}
.brand .pin { color: var(--local); }
.brand small { font-family: var(--kr); font-weight: 400; font-size: 12px; color: var(--muted); }
.lang {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}
.lang button {
  border: 0; background: transparent; cursor: pointer;
  padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted);
}
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ── page ── */
main { max-width: 560px; margin: 0 auto; padding: 0 16px; padding-block: 20px 48px; }
.view { display: grid; gap: 28px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.hero h1 {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(34px, 9vw, 46px); line-height: 1.02; letter-spacing: -.025em;
}
.hero h1 em { font-style: normal; color: var(--local); }
.hero p { margin: 12px 0 0; color: var(--muted); max-width: 40ch; }
.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.sec { display: grid; gap: 12px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.sec-head h2 { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }

/* search */
.search { position: relative; }
.search input {
  width: 100%; padding: 13px 14px 13px 42px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  font-size: 16px;
}
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* cities */
.cities { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.city {
  display: grid; gap: 6px; align-content: start;
  padding: 14px; min-height: 132px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; position: relative; overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.city:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.city .stop {
  width: 26px; height: 26px; border-radius: 50%;
  border: 4px solid var(--city); background: var(--surface);
}
.city h3 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; line-height: 1.1; }
.city h3 .kr { font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 4px; }
.city p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.city .count { font-size: 12px; font-weight: 600; color: var(--city); }

/* chips (themes, categories, shop tabs) */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin: 0 -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding-inline: 0; }
.chip {
  flex: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500;
}
.chip[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-current="page"] .n { color: inherit; opacity: .7; }

/* swaps: "instead of → try" */
.swaps { display: grid; gap: 8px; }
.swap {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  padding: 12px 14px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.swap .from { color: var(--muted); font-size: 13px; text-decoration: line-through; text-decoration-color: var(--tourist); min-width: 0; }
.swap .to { font-weight: 600; font-size: 14px; min-width: 0; }
.swap .to small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.swap .arrow { color: var(--local); }

/* must-buy tiles */
.buy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.buy {
  display: grid; gap: 4px; align-content: start; padding: 14px; text-decoration: none;
  background: var(--tourist-soft); border-radius: var(--radius); min-height: 104px;
}
.buy .k { font-family: var(--kr); font-weight: 700; font-size: 22px; color: var(--tourist); line-height: 1.1; }
.buy h3 { font-size: 15px; font-weight: 600; }
.buy p { margin: 0; font-size: 12px; color: var(--muted); }

/* apps */
.apps { display: grid; gap: 8px; }
.app-row {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.app-row h3 { font-size: 15px; font-weight: 600; }
.app-row p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.mini-btn {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; cursor: pointer; text-decoration: none;
  padding: 6px 10px; font-size: 12px; font-weight: 500; white-space: nowrap;
}

/* city header */
.back {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-size: 14px; color: var(--muted);
}
.city-head { display: grid; gap: 8px; }
.city-head .line-rule { height: 6px; border-radius: 3px; background: var(--city); width: 64px; }
.city-head h1 { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -.02em; line-height: 1; }
.city-head h1 .kr { font-weight: 400; font-size: 18px; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.city-head p { margin: 0; color: var(--muted); }
.toolbar { display: grid; gap: 12px; }
.seg {
  display: inline-flex; padding: 3px; gap: 2px; justify-self: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.seg a {
  padding: 6px 16px; border-radius: 9px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--muted);
}
.seg a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* place cards */
.list { display: grid; gap: 10px; }
.group-title { font-family: var(--display); font-weight: 600; font-size: 18px; margin-top: 8px; color: var(--city); }
.card {
  display: grid; grid-template-columns: 72px 1fr; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  transition: box-shadow .15s ease, border-color .15s ease;
}
.card:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--local) 35%, var(--line)); }
.card-body { display: grid; gap: 8px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.card h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.card .ko { font-family: var(--kr); font-size: 13px; color: var(--muted); }
.card .why { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.card .city-tag { font-weight: 600; color: var(--city); }
.price { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }

/* photo or Korean signboard placeholder */
.thumb {
  width: 72px; height: 72px; border-radius: 12px; overflow: hidden; position: relative;
  background: var(--city); color: var(--sign-ink);
  display: grid; place-items: center; text-align: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.sign {
  font-family: var(--kr); font-weight: 700; line-height: 1.1; padding: 6px; word-break: keep-all;
}
.thumb .sign { font-size: 15px; }
.thumb .sign.long { font-size: 12.5px; }
.thumb::after {
  content: ""; position: absolute; inset: 5px; border: 1.5px solid color-mix(in srgb, var(--sign-ink) 45%, transparent); border-radius: 8px; pointer-events: none;
}
.thumb.has-photo::after { display: none; }
.hero-photo {
  margin: 0 -20px; aspect-ratio: 16 / 9; max-width: calc(100% + 40px); position: relative; overflow: hidden;
  background: var(--city); color: var(--sign-ink); display: grid; place-items: center;
}
.hero-photo img { width: 100%; height: 100%; object-fit: cover; }
.hero-photo .sign { font-size: clamp(28px, 9vw, 44px); padding: 18px 28px; border: 3px solid color-mix(in srgb, var(--sign-ink) 55%, transparent); border-radius: 10px; }
.hero-photo figcaption {
  position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0, 0, 0, .45); padding: 2px 6px; border-radius: 6px;
}

/* local meter */
.meter { display: grid; gap: 5px; }
.meter-label { display: flex; justify-content: space-between; font-size: 12px; }
.meter-label .tag { font-weight: 600; color: var(--local); }
.meter-label .tag.mixed { color: var(--tourist); }
.meter-bars { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 11px; color: var(--muted); }
.dots { display: flex; gap: 3px; }
.dots i { width: 100%; max-width: 22px; height: 6px; border-radius: 3px; background: var(--line); flex: 1; }
.dots.l i.on { background: var(--local); }
.dots.t i.on { background: var(--tourist); }

.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* map */
.map-wrap { display: grid; gap: 8px; }
#map {
  height: min(62vh, 520px); min-height: 340px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--map-empty); z-index: 0;
}
.lp-pin {
  width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--pc); border: 2px solid var(--surface); box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
  display: grid; place-items: center;
}
.lp-pin span { transform: rotate(45deg); width: 8px; height: 8px; border-radius: 50%; background: var(--surface); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-popup-content { margin: 12px 14px; font-family: var(--body); }
.pop { display: grid; gap: 6px; min-width: 160px; }
.pop strong { font-size: 14px; }
.pop .ko { font-family: var(--kr); font-size: 12px; color: var(--muted); }
.pop button { border: 0; border-radius: 8px; padding: 7px 10px; background: var(--local); color: #fff; font-weight: 600; cursor: pointer; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }

/* shopping */
.shop-tips { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.shop-tips li { padding: 12px 14px; background: var(--tourist-soft); border-radius: 12px; font-size: 14px; }
.shop-list { display: grid; gap: 8px; counter-reset: rank; }
.shop {
  display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center;
  padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.shop::before {
  counter-increment: rank; content: counter(rank);
  font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--local); text-align: center;
  font-variant-numeric: tabular-nums;
}
.shop h3 { font-size: 15px; font-weight: 600; }
.shop h3 .kr { font-weight: 400; color: var(--muted); font-size: 13px; }
.shop p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

footer { max-width: 560px; margin: 0 auto; padding: 0 16px; padding-block: 0 40px; font-size: 12px; color: var(--muted); }

/* ── bottom sheet ── */
.scrim {
  position: fixed; inset: 0; z-index: 2000; background: rgba(8, 14, 12, .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; overflow-x: hidden;
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 18px;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -.015em; }
.sheet .ko-big { font-family: var(--kr); font-size: 17px; color: var(--muted); margin-top: 4px; }
.x {
  flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; font-size: 18px; line-height: 1;
}
.sheet .sub { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.sheet h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.instead {
  display: flex; gap: 10px; align-items: center; padding: 12px 14px;
  background: var(--tourist-soft); border-radius: 12px; font-size: 14px;
}
.instead s { text-decoration-color: var(--tourist); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  padding: 13px 14px; border-radius: 12px; cursor: pointer; text-decoration: none;
  font-weight: 600; font-size: 15px; border: 1px solid var(--line); background: var(--bg);
}
.btn.primary { background: var(--local); color: #fff; border-color: var(--local); }
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .pop button { color: #06140f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary, :root:not([data-theme="light"]) .pop button { color: #06140f; } }
.btn.wide { grid-column: 1 / -1; }
.say { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--bg); }
.say .links { display: flex; flex-wrap: wrap; gap: 8px; }

/* ── show-to-staff screen ── */
.staff {
  position: fixed; inset: 0; z-index: 3000; background: var(--bg);
  display: grid; grid-template-rows: auto 1fr auto; padding: 16px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.staff-top { display: flex; justify-content: space-between; align-items: center; }
.slip {
  align-self: center; justify-self: center; width: 100%; max-width: 520px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px;
  display: grid; gap: 18px; text-align: center; box-shadow: var(--shadow);
}
.slip .to-staff { font-family: var(--kr); font-size: 15px; color: var(--muted); }
.slip .big { font-family: var(--kr); font-weight: 600; font-size: clamp(30px, 8.5vw, 44px); line-height: 1.3; word-break: keep-all; }
.slip .place { font-family: var(--kr); font-size: 15px; color: var(--local); font-weight: 600; }
.slip .mean { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 14px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" aria-label="LocalPick Korea home"><span>Local<span class="pin">Pick</span></span><small>로컬픽</small></a>
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
  </div>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<div class="scrim" id="sheet-scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<div class="staff" id="staff" role="dialog" aria-modal="true" aria-label="Show to staff" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LP_DATA;

  /* ── languages ──
   * 새 언어를 추가하려면: LANGS에 한 줄 추가 + 아래 T에 같은 이름으로 문장 묶음 추가.
   * data.js에 그 언어 번역이 없으면 영어로 대신 보여줘요.
   */
  var LANGS = [
    { id: 'en', label: 'EN' },
    { id: 'ja', label: '日本語' }
  ];

  var T = {
    en: {
      heroA: 'Travel Korea', heroB: 'like a local.',
      heroP: 'Where Koreans actually eat, drink and hang out in Seoul, Busan, Jeonju and Gyeongju.',
      search: 'Search places, food, neighborhoods',
      cities: 'Pick a city', picks: function (n) { return n + ' local picks'; },
      themes: 'Browse by theme',
      swaps: 'Skip the tourist version', swapsSub: 'What locals do instead',
      buyTitle: 'What to buy in Korea', buySub: 'What Koreans actually buy, and where',
      appsTitle: 'Apps that work in Korea', appsSub: 'Install before you land',
      back: 'Home', all: 'All', list: 'List', mapTab: 'Map',
      locals: 'Locals', tourists: 'Tourists',
      hidden: 'Hidden local spot', fav: 'Local favorite', both: 'Loved by everyone',

  /* ── language ── */
  var lang = 'en';
  var navLang = (navigator.language || '').toLowerCase();
  function known(id) { return LANGS.some(function (l) { return l.id === id; }); }
  try {
    var saved = localStorage.getItem('lp-lang');
    if (saved && known(saved)) lang = saved;
    else if (known(navLang.slice(0, 2))) lang = navLang.slice(0, 2);
  } catch (e) {
    if (known(navLang.slice(0, 2))) lang = navLang.slice(0, 2);
  }
  function t(key) { var v = T[lang] && T[lang][key]; return v == null ? T.en[key] : v; }
  function L(obj) { return obj ? (obj[lang] || obj.en || '') : ''; }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem('lp-lang', next); } catch (e) {}
    document.documentElement.lang = next;
    document.getElementById('lang').innerHTML = LANGS.map(function (l) {
      return '<button type="button" id="lang-' + l.id + '" data-lang="' + l.id + '" aria-pressed="' + String(l.id === lang) + '">' + esc(l.label) + '</button>';
    }).join('');
    render();
    if (openPlaceId) openSheet(openPlaceId);
  }

  /* ── helpers ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function city(id) { return D.cities.filter(function (c) { return c.id === id; })[0]; }
  function cat(id) { return D.categories.filter(function (k) { return k.id === id; })[0]; }
  function place(id) { return D.places.filter(function (p) { return p.id === id; })[0]; }
  function placesIn(cityId, catId) {
    return D.places.filter(function (p) { return (!cityId || p.city === cityId) && (!catId || p.cat === catId); });
  }
  function group(id) { return D.shopping.groups.filter(function (g) { return g.id === id; })[0]; }
  function cityColor(id) { return 'var(--c-' + id + ')'; }
  function naverUrl(q) { return 'https://map.naver.com/p/search/' + encodeURIComponent(q); }
  function blogUrl(q) { return 'https://search.naver.com/search.naver?ssc=tab.blog.all&query=' + encodeURIComponent(q); }
  function instaUrl(ko) { return 'https://www.instagram.com/explore/tags/' + encodeURIComponent(ko.replace(/\s+/g, '')) + '/'; }

  function verdict(p) {
    var d = p.locals - p.tourists;
    if (d >= 3) return { text: t('hidden'), cls: '' };
    if (d >= 1) return { text: t('fav'), cls: '' };
    return { text: t('both'), cls: 'mixed' };
  }
  function dots(n, cls) {
    var h = '<span class="dots ' + cls + '" aria-hidden="true">';
    for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>';
    return h + '</span>';
  }
  function meter(p) {
    var v = verdict(p);
    return '<div class="meter" aria-label="' + esc(t('locals') + ' ' + p.locals + '/5, ' + t('tourists') + ' ' + p.tourists + '/5') + '">' +
      '<div class="meter-label"><span class="tag ' + v.cls + '">' + esc(v.text) + '</span></div>' +
      '<div class="meter-bars">' +
        '<span>' + esc(t('locals')) + '</span>' + dots(p.locals, 'l') +
        '<span>' + esc(t('tourists')) + '</span>' + dots(p.tourists, 't') +
      '</div></div>';
  }
  function signWord(ko) { return ko.split(' ')[0].slice(0, 4); }
  function thumb(p) {
    if (p.photo && p.photo.src) {
      return '<span class="thumb has-photo"><img src="' + esc(p.photo.src) + '" alt="" loading="lazy"></span>';
    }
    var w = signWord(p.ko);
    return '<span class="thumb" aria-hidden="true"><span class="sign' + (w.length > 3 ? ' long' : '') + '">' + esc(w) + '</span></span>';
  }
  function heroPhoto(p) {
    if (p.photo && p.photo.src) {
      return '<figure class="hero-photo"><img src="' + esc(p.photo.src) + '" alt="' + esc(L(p.name)) + '">' +
        (p.photo.credit ? '<figcaption>© ' + esc(p.photo.credit) + '</figcaption>' : '') + '</figure>';
    }
    return '<div class="hero-photo" aria-hidden="true"><span class="sign">' + esc(p.ko) + '</span></div>';
  }

  var ICON_SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  var ICON_PIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

  function placeCard(p, showCity) {
    return '<button type="button" class="card" data-place="' + esc(p.id) + '" style="--city:' + cityColor(p.city) + '">' +
      thumb(p) +
      '<span class="card-body">' +
        '<span class="card-top"><span><h3>' + esc(L(p.name)) + '</h3><span class="ko">' + esc(p.ko) + '</span></span>' +
        '<span class="price">' + esc(p.price === 'free' ? t('price').free : p.price) + '</span></span>' +
        '<p class="why">' + esc(L(p.why)) + '</p>' +
        meter(p) +
        '<span class="meta">' + (showCity ? '<span class="city-tag">' + esc(L(city(p.city))) + '</span>' : '') + '<span>' + esc(L(p.area)) + '</span></span>' +
      '</span>' +
    '</button>';
  }

  /* ── views ── */
  var searchText = '';

  function viewHome() {
    var h = '<div class="view">';
    h += '<section class="hero"><h1>' + esc(t('heroA')) + '<br><em>' + esc(t('heroB')) + '</em></h1><p>' + esc(t('heroP')) + '</p></section>';
    h += '<div class="search">' + ICON_SEARCH + '<input id="q" type="search" autocomplete="off" placeholder="' + esc(t('search')) + '" aria-label="' + esc(t('search')) + '" value="' + esc(searchText) + '"></div>';
    h += '<div id="home-body">' + homeBody() + '</div>';
    return h + '</div>';
  }

  function homeBody() {
    if (searchText.trim()) return searchResults(searchText.trim());
    var h = '<div class="view">';

    h += '<section class="sec"><div class="sec-head"><h2>' + esc(t('cities')) + '</h2></div><div class="cities">';
    D.cities.forEach(function (c) {
      h += '<a class="city" href="#' + c.id + '" style="--city:' + cityColor(c.id) + '">' +
        '<span class="stop" aria-hidden="true"></span>' +
        '<h3>' + esc(L(c)) + '<span class="kr">' + esc(c.ko) + '</span></h3>' +
        '<p>' + esc(L(c.line)) + '</p>' +
        '<span class="count">' + esc(t('picks')(placesIn(c.id).length)) + '</span></a>';
    });
    h += '</div></section>';

    h += '<section class="sec"><div class="sec-head"><h2>' + esc(t('themes')) + '</h2></div><nav class="chips wrap" aria-label="' + esc(t('themes')) + '">';
    D.categories.forEach(function (k) {
      var n = placesIn(null, k.id).length;
      if (n) h += '<a class="chip" href="#all.' + k.id + '">' + esc(L(k)) + '<span class="n">' + n + '</span></a>';
    });
    h += '</nav></section>';

    var swaps = D.places.filter(function (p) { return p.insteadOf; });
    if (swaps.length) {
      h += '<section class="sec"><div class="sec-head"><h2>' + esc(t('swaps')) + '</h2><span class="eyebrow">' + esc(t('swapsSub')) + '</span></div><div class="swaps">';
      swaps.slice(0, 6).forEach(function (p) {
        h += '<button type="button" class="swap" data-place="' + esc(p.id) + '">' +
          '<span class="from">' + esc(L(p.insteadOf)) + '</span>' +
          '<span class="arrow" aria-hidden="true">→</span>' +
          '<span class="to">' + esc(L(p.name)) + '<small>' + esc(L(city(p.city))) + '</small></span></button>';
      });
      h += '</div></section>';
    }

    h += '<section class="sec"><div class="sec-head"><h2>' + esc(t('buyTitle')) + '</h2><span class="eyebrow">' + esc(t('buySub')) + '</span></div><div class="buy-grid">';
    D.shopping.groups.forEach(function (g) {
      h += '<a class="buy" href="#shopping.' + g.id + '"><span class="k">' + esc(g.ko) + '</span><h3>' + esc(L(g.name)) + '</h3><p>' + esc(g.items.length + ' · ' + g.items.slice(0, 2).map(function (it) { return L(it.name); }).join(', ')) + '</p></a>';
    });
    h += '</div></section>';

    h += '<section class="sec"><div class="sec-head"><h2>' + esc(t('appsTitle')) + '</h2><span class="eyebrow">' + esc(t('appsSub')) + '</span></div><div class="apps">';
    t('apps').forEach(function (a) {
      h += '<div class="app-row"><div><h3>' + esc(a.name) + '</h3><p>' + esc(a.what) + '</p></div>' +
        (a.url ? '<a class="mini-btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(t('open')) + ' ↗</a>' : '<span></span>') + '</div>';
    });
    h += '</div></section>';

    return h + '</div>';
  }

  function searchResults(q) {
    var needle = q.toLowerCase();
    var hits = D.places.filter(function (p) {
      var c = city(p.city);
      var hay = [p.ko, p.name.en, p.name.ja, p.area.en, p.area.ja, p.why.en, p.why.ja, c.en, c.ja, c.ko].join(' ').toLowerCase();
      return hay.indexOf(needle) !== -1;
    });
    if (!hits.length) return '<div class="empty">' + esc(t('noResults')) + '</div>';
    return '<section class="sec"><span class="eyebrow">' + esc(t('results')(hits.length)) + '</span><div class="list">' +
      hits.map(function (p) { return placeCard(p, true); }).join('') + '</div></section>';
  }

  function viewCity(c, catId, mode) {
    var all = placesIn(c.id);
    var shown = placesIn(c.id, catId);
    var base = '#' + c.id + (mode === 'map' ? '.map' : '');
    var h = '<div class="view" style="--city:' + cityColor(c.id) + '">';
    h += '<a class="back" href="#">← ' + esc(t('back')) + '</a>';
    h += '<section class="city-head"><span class="line-rule" aria-hidden="true"></span><h1>' + esc(L(c)) + '<span class="kr">' + esc(c.ko) + '</span></h1><p>' + esc(L(c.line)) + '</p></section>';
    h += '<div class="toolbar">';
    h += '<nav class="seg" aria-label="View">' +
      '<a href="#' + c.id + (catId ? '.' + catId : '') + '"' + (mode !== 'map' ? ' aria-current="page"' : '') + '>' + esc(t('list')) + '</a>' +
      '<a href="#' + c.id + '.map' + (catId ? '.' + catId : '') + '"' + (mode === 'map' ? ' aria-current="page"' : '') + '>' + esc(t('mapTab')) + '</a></nav>';
    h += '<nav class="chips" aria-label="Category">';
    h += '<a class="chip" href="' + base + '"' + (!catId ? ' aria-current="page"' : '') + '>' + esc(t('all')) + '<span class="n">' + all.length + '</span></a>';
    D.categories.forEach(function (k) {
      var n = placesIn(c.id, k.id).length;
      if (!n) return;
      h += '<a class="chip" href="' + base + '.' + k.id + '"' + (catId === k.id ? ' aria-current="page"' : '') + '>' + esc(L(k)) + '<span class="n">' + n + '</span></a>';
    });
    h += '</nav></div>';
    if (mode === 'map') {
      h += '<div class="map-wrap"><div id="map" role="region" aria-label="' + esc(t('mapTab')) + '"></div><p class="note" id="map-note">' + esc(t('mapNote')) + '</p></div>';
    } else {
      h += '<div class="list">' + (shown.length ? shown.map(function (p) { return placeCard(p, false); }).join('') : '<div class="empty">' + esc(t('noResults')) + '</div>') + '</div>';
    }
    return h + '</div>';
  }

  function viewTheme(k) {
    var h = '<div class="view">';
    h += '<a class="back" href="#">← ' + esc(t('back')) + '</a>';
    h += '<section class="city-head" style="--city:var(--local)"><span class="line-rule" aria-hidden="true"></span><h1>' + esc(L(k)) + '<span class="kr">' + esc(k.ko) + '</span></h1></section>';
    h += '<nav class="chips" aria-label="' + esc(t('themes')) + '">';
    D.categories.forEach(function (x) {
      var n = placesIn(null, x.id).length;
      if (n) h += '<a class="chip" href="#all.' + x.id + '"' + (x.id === k.id ? ' aria-current="page"' : '') + '>' + esc(L(x)) + '<span class="n">' + n + '</span></a>';
    });
    h += '</nav><div class="list">';
    D.cities.forEach(function (c) {
      var ps = placesIn(c.id, k.id);
      if (!ps.length) return;
      h += '<h2 class="group-title" style="--city:' + cityColor(c.id) + '">' + esc(L(c)) + ' <span class="kr" style="font-weight:400;font-size:14px;color:var(--muted)">' + esc(c.ko) + '</span></h2>';
      h += ps.map(function (p) { return placeCard(p, false); }).join('');
    });
    return h + '</div></div>';
  }

  function viewShopping(gid) {
    var g = group(gid) || D.shopping.groups[0];
    var h = '<div class="view">';
    h += '<a class="back" href="#">← ' + esc(t('back')) + '</a>';
    h += '<section class="city-head" style="--city:var(--tourist)"><span class="line-rule" aria-hidden="true"></span><h1>' + esc(t('buyTitle')) + '</h1><p>' + esc(t('buySub')) + '</p></section>';
    h += '<nav class="chips" aria-label="' + esc(t('buyTitle')) + '">';
    D.shopping.groups.forEach(function (x) {
      h += '<a class="chip" href="#shopping.' + x.id + '"' + (x.id === g.id ? ' aria-current="page"' : '') + '>' + esc(L(x.name)) + ' <span class="kr n">' + esc(x.ko) + '</span></a>';
    });
    h += '</nav>';
    h += '<p style="margin:0">' + esc(L(g.intro)) + '</p>';
    h += '<section class="sec"><h2 class="eyebrow">' + esc(t('shopTips')) + '</h2><ul class="shop-tips">' +
      (L(g.tips) || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    h += '<section class="sec"><h2 class="eyebrow">' + esc(t('shopTop')) + '</h2><div class="shop-list">';
    g.items.forEach(function (it, i) {
      h += '<div class="shop"><div><h3>' + esc(L(it.name)) + ' <span class="kr">' + esc(it.ko) + '</span></h3><p>' + esc(L(it.why)) + '</p></div>' +
        '<button type="button" class="mini-btn" data-staff-shop="' + esc(g.id) + ':' + i + '">' + esc(t('staff')) + '</button></div>';
    });
    h += '</div></section>';
    return h + '</div>';
  }

  /* ── map (Leaflet) ── */
  var mapInst = null;
  function destroyMap() { if (mapInst) { mapInst.remove(); mapInst = null; } }

  function drawMap(c, catId) {
    var el = document.getElementById('map');
    if (!el || !window.L) return;
    var pins = placesIn(c.id, catId).filter(function (p) { return typeof p.lat === 'number' && typeof p.lng === 'number'; });
    var note = document.getElementById('map-note');
    if (!pins.length) {
      el.outerHTML = '<div class="empty">' + esc(t('noPins')) + '</div>';
      if (note) note.hidden = true;
      return;
    }
    mapInst = window.L.map(el, { scrollWheelZoom: false });
    var tiles = window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(mapInst);
    var warned = false;
    tiles.on('tileerror', function () {
      if (warned || !note) return;
      warned = true;
      note.textContent = t('tileFail') + ' ' + t('mapNote');
    });
    var bounds = [];
    pins.forEach(function (p) {
      var icon = window.L.divIcon({
        className: '',
        html: '<div class="lp-pin" style="--pc:' + cityColor(p.city) + '"><span></span></div>',
        iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24]
      });
      window.L.marker([p.lat, p.lng], { icon: icon, title: L(p.name), alt: L(p.name) })
        .addTo(mapInst)
        .bindPopup('<div class="pop"><span class="eyebrow">' + esc(L(cat(p.cat))) + '</span><strong>' + esc(L(p.name)) + '</strong><span class="ko">' + esc(p.ko) + '</span>' +
          '<button type="button" data-place="' + esc(p.id) + '">' + esc(t('details')) + '</button></div>');
      bounds.push([p.lat, p.lng]);
    });
    if (bounds.length === 1) mapInst.setView(bounds[0], 14);
    else mapInst.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
  }

  /* ── router: #seoul  #seoul.cafe  #seoul.map  #seoul.map.cafe  #all.kids  #shopping.pharmacy ── */
  function render() {
    destroyMap();
    var hash = (location.hash || '').replace(/^#/, '');
    var parts = hash.split('.');
    var app = document.getElementById('app');
    var c = city(parts[0]);

    if (c) {
      var mode = parts[1] === 'map' ? 'map' : 'list';
      var rawCat = mode === 'map' ? parts[2] : parts[1];
      var catId = rawCat && cat(rawCat) ? rawCat : null;
      app.innerHTML = viewCity(c, catId, mode);
      document.title = L(c) + ' · LocalPick Korea';
      if (mode === 'map') drawMap(c, catId);
    } else if (parts[0] === 'all' && cat(parts[1])) {
      app.innerHTML = viewTheme(cat(parts[1]));
      document.title = L(cat(parts[1])) + ' · LocalPick Korea';
    } else if (parts[0] === 'shopping') {
      app.innerHTML = viewShopping(parts[1]);
      document.title = t('buyTitle') + ' · LocalPick Korea';
    } else {
      app.innerHTML = viewHome();
      document.title = 'LocalPick Korea';
      bindSearch();
    }
    document.getElementById('foot').textContent = t('foot');
  }

  function bindSearch() {
    var q = document.getElementById('q');
    if (!q) return;
    q.addEventListener('input', function () {
      searchText = q.value;
      document.getElementById('home-body').innerHTML = homeBody();
    });
  }

  /* ── place sheet ── */
  var openPlaceId = null;
  var lastFocus = null;

  function openSheet(id) {
    var p = place(id);
    if (!p) return;
    if (!openPlaceId) lastFocus = document.activeElement;
    openPlaceId = id;
    if (mapInst) mapInst.closePopup();
    var c = city(p.city);
    var h = '<div class="grab" aria-hidden="true"></div>';
    h += '<div class="sheet-head" style="--city:' + cityColor(p.city) + '"><div><span class="eyebrow" style="color:var(--city)">' + esc(L(c)) + ' · ' + esc(L(cat(p.cat))) + '</span>' +
      '<h2 id="sheet-title">' + esc(L(p.name)) + '</h2><div class="ko-big">' + esc(p.ko) + '</div></div>' +
      '<button type="button" class="x" data-close aria-label="' + esc(t('close')) + '">×</button></div>';
    h += '<div style="--city:' + cityColor(p.city) + '">' + heroPhoto(p) + '</div>';
    h += '<div class="sub"><span>' + esc(L(p.area)) + '</span><span class="price">' + esc(t('price')[p.price] || p.price) + '</span></div>';
    h += meter(p);
    if (p.insteadOf) h += '<div class="instead"><span>' + esc(t('insteadOf')) + '</span><s>' + esc(L(p.insteadOf)) + '</s></div>';
    h += '<div><h4>' + esc(t('why')) + '</h4><p>' + esc(L(p.why)) + '</p></div>';
    var tips = L(p.tips);
    if (tips && tips.length) h += '<div><h4>' + esc(t('tips')) + '</h4><ul>' + tips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    h += '<div class="actions">' +
      '<a class="btn primary wide" href="' + esc(naverUrl(p.map || p.ko)) + '" target="_blank" rel="noopener">' + ICON_PIN + esc(t('map')) + '</a>' +
      '<button type="button" class="btn" data-staff-place="' + esc(p.id) + '">' + esc(t('staff')) + '</button>' +
      '<button type="button" class="btn" data-copy="' + esc(p.ko) + '">' + esc(t('copy')) + '</button>' +
    '</div>';
    h += '<div class="say"><h4>' + esc(t('say')) + '</h4><div class="links">' +
      '<a class="mini-btn" href="' + esc(blogUrl(p.map || p.ko)) + '" target="_blank" rel="noopener">' + esc(t('sayNaver')) + ' ↗</a>' +
      '<a class="mini-btn" href="' + esc(instaUrl(p.ko)) + '" target="_blank" rel="noopener">' + esc(t('sayInsta')) + ' ↗</a>' +
      '</div><p class="note">' + esc(t('sayNote')) + '</p></div>';
    h += '<p class="note">' + esc(t('naverNote')) + '</p>';

    var sheet = document.getElementById('sheet');
    sheet.innerHTML = h;
    document.getElementById('sheet-scrim').hidden = false;
    document.body.style.overflow = 'hidden';
    sheet.scrollTop = 0;
    var x = sheet.querySelector('[data-close]');
    if (x) x.focus();
  }

  function closeSheet() {
    openPlaceId = null;
    document.getElementById('sheet-scrim').hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }

  /* ── show-to-staff screen ── */
  function openStaff(korean, meaning, placeKo) {
    var el = document.getElementById('staff');
    el.innerHTML =
      '<div class="staff-top"><span class="eyebrow">' + esc(t('staffTop')) + '</span>' +
      '<button type="button" class="x" data-staff-close aria-label="' + esc(t('close')) + '">×</button></div>' +
      '<div class="slip">' +
        '<div class="to-staff" lang="ko">사장님, 이거 봐 주세요 🙏</div>' +
        (placeKo ? '<div class="place" lang="ko">' + esc(placeKo) + '</div>' : '') +
        '<div class="big" lang="ko">' + esc(korean) + '</div>' +
        '<div class="mean">' + esc(meaning) + '</div>' +
      '</div><div></div>';
    el.hidden = false;
    var x = el.querySelector('[data-staff-close]');
    if (x) x.focus();
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) { el._lock = l; }).catch(function () {});
    }
  }
  function closeStaff() {
    var el = document.getElementById('staff');
    el.hidden = true;
    if (el._lock) { el._lock.release().catch(function () {}); el._lock = null; }
    var back = document.querySelector('#sheet [data-staff-place]');
    if (back && openPlaceId) back.focus();
  }

  function copyText(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = t('copied');
      setTimeout(function () { btn.textContent = old; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackSelect(); });
    } else { fallbackSelect(); }
  }
  function fallbackSelect() {
    var big = document.querySelector('#sheet .ko-big');
    if (!big) return;
    var r = document.createRange(); r.selectNodeContents(big);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  /* ── events ── */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-lang],[data-place],[data-close],[data-staff-place],[data-staff-shop],[data-staff-close],[data-copy]');
    if (!el) {
      if (e.target.id === 'sheet-scrim') closeSheet();
      return;
    }
    if (el.dataset.lang) return setLang(el.dataset.lang);
    if (el.dataset.place) return openSheet(el.dataset.place);
    if (el.hasAttribute('data-close')) return closeSheet();
    if (el.hasAttribute('data-staff-close')) return closeStaff();
    if (el.dataset.staffPlace) {
      var p = place(el.dataset.staffPlace);
      return openStaff(p.order.ko, L(p.order), p.ko);
    }
    if (el.dataset.staffShop) {
      var ref = el.dataset.staffShop.split(':');
      var g = group(ref[0]);
      var it = g && g.items[+ref[1]];
      if (it) return openStaff(it.ko + ' 어디 있어요?', L(it.name) + ' · ' + t('whereIs'), g.ko);
      return;
    }
    if (el.dataset.copy) return copyText(el.dataset.copy, el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('staff').hidden) closeStaff();
    else if (openPlaceId) closeSheet();
  });

  window.addEventListener('hashchange', function () {
    if (openPlaceId) closeSheet();
    searchText = '';
    render();
    window.scrollTo(0, 0);
  });

  setLang(lang);
})();
</script>
</body>
</html>
